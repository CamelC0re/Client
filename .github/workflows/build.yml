name: Build EvilLite (Linux / Windows / macOS)

# Cross-platform builds happen on native runners — Windows installers need Windows
# (or Wine), and macOS .dmg / universal / code-signing are macOS-only. A single Linux
# box can only build Linux, so this matrix is how we produce all three.
#
# Run manually (Actions → this workflow → Run), or it runs on a v* tag. Artifacts are
# attached to the run for testers to download; on a tag it also drafts a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The World Map plugin's source of truth is its own repo. Pull BOTH the plugin
      # source and its prebaked icon cache from there so packaged builds bundle the
      # current plugin (the copy tracked in this fork can lag) and ship the icons
      # instead of regenerating them at runtime. Best-effort: build still works without.
      - name: Sync World Map plugin + prebaked cache from the plugin repo
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-worldmap.git /tmp/wm || exit 0
          cp /tmp/wm/src/WorldMapPlugin.ts packages/client/src/renderer/client/plugins/WorldMapPlugin.ts 2>/dev/null || true
          mkdir -p packages/client/src/renderer/client/plugins/data
          cp /tmp/wm/data/*.json packages/client/src/renderer/client/plugins/data/ 2>/dev/null || true

      # Temp core plugins (until the Plugin Hub installs them) also live in their own repos.
      - name: Sync Collection Log plugin from its repo
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-collectionlog.git /tmp/cl || exit 0
          cp /tmp/cl/src/CollectionLogPlugin.ts packages/client/src/renderer/client/plugins/CollectionLogPlugin.ts 2>/dev/null || true

      # Anti-bot guard: fail the build if the client/core OR any bundled plugin contains an
      # input-fabrication / trusted-input bypass. Runs AFTER the plugin sync so it scans the
      # bundled plugins too. We never ship a way to bot EvilQuest. See docs/anti-bot.md.
      - name: Anti-bot guard (no input fabrication)
        run: node scripts/guard-input-fabrication.mjs

      - name: Build core
        run: yarn workspace @evillite/core build

      - name: Build client (renderer + main + copy plugin cache)
        # __EVILLITE_CANONICAL__ is baked here: TRUE only when this build runs in the canonical
        # CamelC0re/Client repo, so fork builds (e.g. atapifire/EvilLite betas testers grab) never
        # auto-update, while canonical builds update from CamelC0re/Client. See updater/index.ts.
        env:
          EVILLITE_CANONICAL: ${{ github.repository == 'CamelC0re/Client' }}
        run: yarn workspace @evillite/client build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build unsigned for tester handoff. Add signing creds + flip this on later.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          EV=$(node -p "require('electron/package.json').version")
          echo "Packaging with electron $EV"
          yarn workspace @evillite/client exec electron-builder \
            --${{ matrix.platform }} -c.electronVersion="$EV" --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: evillite-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            packages/client/dist/*.AppImage
            packages/client/dist/*.deb
            packages/client/dist/*.tar.gz
            packages/client/dist/*.exe
            packages/client/dist/*.dmg
            packages/client/dist/*.zip
            packages/client/dist/*.blockmap
            packages/client/dist/*.yml
            # Every platform emits an identically-named builder-debug.yml; uploading all
            # three collides on the same release asset name and fails the release job. It's
            # an electron-builder debug dump testers don't need — exclude it.
            !packages/client/dist/builder-debug.yml

  # Android APK (Capacitor mobile shell). Separate from the desktop matrix — it needs the JDK +
  # Android SDK, not electron-builder. Produces an unsigned debug APK testers can sideload.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # Same temp plugin sync as the desktop build (until the Plugin Hub installs them).
      - name: Sync World Map plugin + prebaked cache
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-worldmap.git /tmp/wm || exit 0
          cp /tmp/wm/src/WorldMapPlugin.ts packages/client/src/renderer/client/plugins/WorldMapPlugin.ts 2>/dev/null || true
          mkdir -p packages/client/src/renderer/client/plugins/data
          cp /tmp/wm/data/*.json packages/client/src/renderer/client/plugins/data/ 2>/dev/null || true
      - name: Sync Collection Log plugin
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-collectionlog.git /tmp/cl || exit 0
          cp /tmp/cl/src/CollectionLogPlugin.ts packages/client/src/renderer/client/plugins/CollectionLogPlugin.ts 2>/dev/null || true
      - name: Anti-bot guard (no input fabrication)
        run: node scripts/guard-input-fabrication.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build core + renderer
        run: |
          yarn workspace @evillite/core build
          yarn workspace @evillite/client build
      # Fork builds (atapifire/EvilLite) -> DEBUG apk: debuggable, WebView inspectable over adb, for
      # our own testing. Canonical (CamelC0re/Client) -> SIGNED RELEASE apk: debuggable=false, so the
      # WebView can't be driven over chrome://inspect (CDP injects isTrusted input that would bypass
      # EvilQuest's anti-bot). Same canonical/fork split as the desktop updater gate. A canonical
      # build with no signing secrets FAILS rather than silently shipping a debuggable apk.
      # See docs/anti-bot.md + docs/release-signing.md.
      - name: Build APK (debug on fork, signed release on canonical)
        working-directory: packages/mobile
        env:
          IS_CANONICAL: ${{ github.repository == 'CamelC0re/Client' }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/build-web.mjs
          npx cap add android
          cp android-template/app/src/main/java/net/evilquest/evillite/*.java \
             android/app/src/main/java/net/evilquest/evillite/
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android
          mkdir -p out-apk
          if [ "$IS_CANONICAL" = "true" ]; then
            if [ -z "$ANDROID_KEYSTORE_B64" ]; then
              echo "::error::Canonical release APK requires signing secrets (ANDROID_KEYSTORE_B64 etc). See docs/release-signing.md. Refusing to ship a debuggable APK."
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # AGP injected signing — no need to edit the Capacitor-generated build.gradle.
            (cd android && ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD")
            cp android/app/build/outputs/apk/release/app-release.apk out-apk/EvilLite-android.apk
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk out-apk/EvilLite-android-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evillite-android
          if-no-files-found: warn
          path: packages/mobile/out-apk/*.apk

  # On a v* tag, gather every platform's installers into one GitHub Release so testers
  # have permanent public download links (and electron-updater has its latest*.yml feed).
  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          # Tags with a pre-release suffix (e.g. v0.2.0-beta.1) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Automated cross-platform build. **Unsigned**, so you'll see a one-time OS warning.

            ### Install
            - **Windows** — `EvilLite-Setup-*.exe`. SmartScreen → *More info* → *Run anyway*.
            - **macOS** — `*.dmg` (use `arm64` for Apple Silicon, the plain one for Intel).
              Drag to Applications, then right-click the app → *Open* the first time
              (or `xattr -dr com.apple.quarantine /Applications/EvilLite.app`).
            - **Linux — easiest:** `*.deb` → `sudo apt install ./EvilLite-*.deb`, then launch
              **EvilLite** from your apps menu. No flags, no extra packages.
            - **Linux — portable:** `*.AppImage` or `*.tar.gz`. On modern distros these may need
              `--no-sandbox` (and the AppImage needs `libfuse2`); the `.deb` avoids both.
            - **Android** — `EvilLite-android-debug.apk`. Sideload it (enable *Install unknown apps*).
              Unsigned debug build; log in with your EvilQuest account in the system browser.

            `arm64` files are for ARM machines (Apple Silicon, ARM Linux); the others are x64/Intel.
