<!doctype html>
<html lang="en">
    <head>
        <script>
            // ── 1. Removed naive window.chrome spoofing (detectable by reCAPTCHA) ─────────



            // ── 3. Error logging — surface game engine failures to main process ─────────
            window.onerror = function(msg, src, line, col, err) {
                console.error('[GameError]', msg, 'at', src + ':' + line, err?.stack || '');
            };
            window.addEventListener('unhandledrejection', function(e) {
                console.error('[GameRejection]', e.reason?.message || String(e.reason), e.reason?.stack || '');
            });

            // ── 4. WebSocket URL failsafe + logging ──────────────────────────────────
            // Patch WebSocket to: (a) upgrade ws:// to wss://, (b) log all connections.
            try {
                var _OrigWS = window.WebSocket;
                function _PatchedWS(url, protocols) {
                    if (typeof url === 'string') {
                        var fixed = url.replace(/^ws:\/\/evilquest\.net/, 'wss://evilquest.net');
                        if (fixed !== url) console.log('[WS-PATCH] ' + url + ' → ' + fixed);
                        url = fixed;
                    }
                    console.log('[WS-CREATE] url=' + url + ' protocols=' + JSON.stringify(protocols));
                    var ws = protocols !== undefined ? new _OrigWS(url, protocols) : new _OrigWS(url);
                    ws.addEventListener('open', function() { console.log('[WS-OPEN] ' + url); });
                    ws.addEventListener('close', function(e) { console.log('[WS-CLOSE] code=' + e.code + ' reason=' + e.reason + ' url=' + url); });
                    ws.addEventListener('error', function(e) { console.log('[WS-ERROR] ' + url + ' ' + (e.message || '')); });
                    return ws;
                }
                _PatchedWS.prototype = _OrigWS.prototype;
                _PatchedWS.CONNECTING = _OrigWS.CONNECTING;
                _PatchedWS.OPEN = _OrigWS.OPEN;
                _PatchedWS.CLOSING = _OrigWS.CLOSING;
                _PatchedWS.CLOSED = _OrigWS.CLOSED;
                window.WebSocket = _PatchedWS;
            } catch(e) {}
        </script>
        <script type="importmap">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <meta charset="UTF-8" />
        <style>
            /* Warning indicator specific styles */
            #warningIndicator .warning-icon {
                color: var(--theme-text-primary, #ffffff);
            }

            #warningIndicator .warning-icon.warning {
                color: var(--theme-accent, #f9f449) !important;
            }

            #warningIndicator .warning-icon.error {
                color: var(--theme-danger, #ef4444) !important;
            }

            #warningIndicator:hover .warning-icon {
                transform: scale(1.1);
                transition: transform 0.2s ease;
            }

            /* ── Window layout ──────────────────────────────────────────────────────
               Two modes, toggled by a body class (see layout.ts), driven by the
               "Layout Mode" setting:
                 • Reserve Space — titlebar (top) + plugin sidebar (right) take real
                   layout room; the game shrinks to fit between them (RuneLite-style).
                 • Overlay — the game fills the window (clicks unaffected) and the
                   titlebar + sidebar float on top.                                    */
            html, body { margin: 0; height: 100%; }
            body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

            /* #main holds the game + the plugin sidebar (highlite_bar) as a flex row. */
            #main {
                position: relative;
                display: flex;
                flex-direction: row;
                flex: 1 1 auto;
                min-height: 0;
                min-width: 0;
            }
            #game-wrapper { flex: 1 1 auto; min-width: 0; }

            .highlite_titlebar {
                left: 0;
                right: 0;
                z-index: 2147483646;
                transition: transform 0.18s ease, opacity 0.18s ease;
            }
            .highlite_titlebar.eq-titlebar-hidden {
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
            }

            /* Reserve Space: titlebar sits in normal flow (reserves its height); the
               sidebar is a flex sibling of the game (reserves its width). */
            body.eq-layout-reserve .highlite_titlebar { position: relative; flex: 0 0 auto; }
            body.eq-layout-reserve.eq-titlebar-autohide .highlite_titlebar { position: fixed; top: 0; }

            /* Overlay: titlebar + sidebar are fixed, floating over the full-window game. */
            body.eq-layout-overlay .highlite_titlebar { position: fixed; top: 0; }
            body.eq-layout-overlay .highlite_bar {
                position: fixed; right: 0; bottom: 0; top: var(--titlebar-height);
            }
            body.eq-layout-overlay.eq-titlebar-autohide .highlite_bar { top: 0; }
            body.eq-layout-overlay .highlite_bar_selected_content {
                position: fixed; right: 30px; bottom: 0; top: var(--titlebar-height);
            }
            body.eq-layout-overlay.eq-titlebar-autohide .highlite_bar_selected_content { top: 0; }
        </style>
    </head>

            </div>

                <a href="#" target="_blank" rel="noopener noreferrer">
                    <i class="iconify" data-icon="simple-icons:discord"></i>
                </a>
                <a style="display: none" id="warningIndicator" href="#"

                <a id="settingsBtn" href="#"

                    <a id="maximizeBtn" class="window-control" title="Maximize"

                    ></a>
                </div>
            </div>
